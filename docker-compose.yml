version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: novel_crm_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-novel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novel_secret}
      POSTGRES_DB: ${DB_NAME:-novel_crm}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - novel_net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: novel_crm_backend
    environment:
      DB_HOST: postgres.novel-crm_novel_net
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-novel}
      DB_PASSWORD: ${DB_PASSWORD:-novel_secret}
      DB_NAME: ${DB_NAME:-novel_crm}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_EXPIRE_MINUTES: 1440
      JWT_REFRESH_EXPIRE_DAYS: 30
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      ZVENO_API_KEY: ${ZVENO_API_KEY}
      ZVENO_BASE_URL: ${ZVENO_BASE_URL:-https://api.zveno.ai/v1}
    ports:
      - "3020:8000"
    depends_on:
      - postgres
    networks:
      - novel_net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  novel_net:
    driver: bridge
