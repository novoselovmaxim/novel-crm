<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База обзвона</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222536;
  --border: #2e3148;
  --accent: #4f6ef7;
  --accent-hover: #6b85ff;
  --text: #e2e8f0;
  --muted: #8892a4;
  --success: #22c55e;
  --warn: #f59e0b;
  --danger: #ef4444;
  --info: #3b82f6;
  --purple: #a78bfa;
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* Header */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.header-title { font-size: 16px; font-weight: 600; color: var(--text); }
.header-stats { color: var(--muted); font-size: 13px; }
.header-stats span { color: var(--accent); font-weight: 600; }

/* Filters */
.filters { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
.filter-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none; }
.filter-input:focus { border-color: var(--accent); }
.filter-input.search { width: 240px; }
select.filter-input { cursor: pointer; }
.btn { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
.filter-label { color: var(--muted); font-size: 12px; }

/* Main layout */
.main { display: flex; flex: 1; overflow: hidden; }

/* Table */
.table-wrap { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; }
thead { position: sticky; top: 0; z-index: 10; }
thead th { background: var(--surface2); color: var(--muted); font-weight: 500; font-size: 12px; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
tbody tr:hover { background: var(--surface2); }
tbody tr.active { background: #1e2442; }
td { padding: 9px 12px; vertical-align: top; max-width: 240px; }
td.name { font-weight: 500; color: var(--text); }
td.phone { font-family: monospace; font-size: 12px; color: var(--info); }
td.region { color: var(--muted); font-size: 12px; }
td.source { font-size: 11px; }

.status-badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.status-new { background: #1e2442; color: #8892a4; }
.status-no_answer { background: #2d2015; color: var(--warn); }
.status-busy { background: #2d2015; color: #fb923c; }
.status-callback { background: #1a2d3d; color: #60a5fa; }
.status-interested { background: #14281c; color: var(--success); }
.status-rejected { background: #2d1515; color: var(--danger); }
.status-converted { background: #1a2b3c; color: var(--purple); }

/* Detail panel */
.detail { width: 420px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; transition: width 0.2s; }
.detail.hidden { width: 0; border: none; }
.detail-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-shrink: 0; }
.detail-name { font-size: 15px; font-weight: 600; line-height: 1.3; }
.detail-body { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.detail-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px; flex-shrink: 0; }
.detail-close:hover { color: var(--text); }

.info-group { display: flex; flex-direction: column; gap: 6px; }
.info-group-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; }
.info-row { display: flex; gap: 8px; }
.info-label { color: var(--muted); font-size: 12px; flex-shrink: 0; width: 110px; }
.info-value { color: var(--text); font-size: 12px; word-break: break-word; }
.info-value a { color: var(--accent); text-decoration: none; }
.info-value a:hover { text-decoration: underline; }

/* Call section */
.call-section { background: var(--surface2); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.call-section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.status-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.status-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
.status-btn:hover, .status-btn.selected { border-color: currentColor; }
.status-btn.s-no_answer { color: var(--warn); }
.status-btn.s-no_answer.selected { background: #2d2015; }
.status-btn.s-busy { color: #fb923c; }
.status-btn.s-busy.selected { background: #2d2015; }
.status-btn.s-callback { color: #60a5fa; }
.status-btn.s-callback.selected { background: #1a2d3d; }
.status-btn.s-interested { color: var(--success); }
.status-btn.s-interested.selected { background: #14281c; }
.status-btn.s-rejected { color: var(--danger); }
.status-btn.s-rejected.selected { background: #2d1515; }
.status-btn.s-converted { color: var(--purple); }
.status-btn.s-converted.selected { background: #1a2b3c; }

textarea.note-input { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13px; resize: vertical; min-height: 60px; outline: none; width: 100%; font-family: inherit; }
textarea.note-input:focus { border-color: var(--accent); }
input.date-input { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none; width: 100%; }
input.date-input:focus { border-color: var(--accent); }

.save-call-btn { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 500; align-self: flex-start; }
.save-call-btn:hover { background: var(--accent-hover); }
.save-call-btn:disabled { opacity: 0.5; cursor: default; }

/* History */
.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-item { background: var(--surface2); border-radius: 6px; padding: 8px 10px; }
.history-item-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.history-date { font-size: 11px; color: var(--muted); }
.history-notes { font-size: 12px; color: var(--text); }
.empty-history { color: var(--muted); font-size: 12px; font-style: italic; }

/* Pagination */
.pagination { background: var(--surface); border-top: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.page-info { color: var(--muted); font-size: 13px; }
.page-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
.page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.page-btn:disabled { opacity: 0.4; cursor: default; }

/* Loading */
.loading { color: var(--muted); padding: 40px; text-align: center; }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }

.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">База обзвона</div>
  <div class="header-stats">Найдено: <span id="total-count">—</span> контактов</div>
</div>

<div class="filters">
  <input id="search-input" class="filter-input search" type="text" placeholder="Поиск по названию, ИНН, телефону, региону...">
  <select id="filter-source" class="filter-input">
    <option value="">Все источники</option>
  </select>
  <select id="filter-type" class="filter-input">
    <option value="">Все типы</option>
    <option value="ЮрЛицо">ЮрЛицо</option>
    <option value="ИП">ИП</option>
  </select>
  <select id="filter-status" class="filter-input">
    <option value="">Все статусы</option>
    <option value="__empty__">Без статуса</option>
    <option value="no_answer">Не дозвонился</option>
    <option value="busy">Занято</option>
    <option value="callback">Перезвонить</option>
    <option value="interested">Заинтересован</option>
    <option value="rejected">Отказ</option>
    <option value="converted">Клиент</option>
  </select>
  <select id="filter-phone" class="filter-input">
    <option value="">С телефоном и без</option>
    <option value="1">Только с телефоном</option>
  </select>
  <button class="btn btn-ghost" onclick="resetFilters()">Сбросить</button>
</div>

<div class="main">
  <div class="table-wrap" id="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Компания / ФИО</th>
          <th>Телефон</th>
          <th>Регион</th>
          <th>Деятельность</th>
          <th>Источник</th>
          <th>Статус</th>
          <th>Следующий звонок</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="8" class="loading">Загрузка...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="detail hidden" id="detail-panel">
    <div class="detail-header">
      <div class="detail-name" id="detail-name"></div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<div class="pagination">
  <button class="page-btn" id="btn-prev" onclick="prevPage()">← Назад</button>
  <span class="page-info" id="page-info">—</span>
  <button class="page-btn" id="btn-next" onclick="nextPage()">Вперёд →</button>
</div>

<div class="toast" id="toast"></div>

<script>
const LIMIT = 100;
let offset = 0;
let total = 0;
let activeId = null;
let selectedStatus = '';
let searchTimer = null;

const STATUSES = {
  no_answer:  { label: 'Не дозвонился', cls: 'status-no_answer' },
  busy:       { label: 'Занято',        cls: 'status-busy' },
  callback:   { label: 'Перезвонить',   cls: 'status-callback' },
  interested: { label: 'Заинтересован', cls: 'status-interested' },
  rejected:   { label: 'Отказ',         cls: 'status-rejected' },
  converted:  { label: 'Клиент',        cls: 'status-converted' },
};

function statusBadge(s) {
  if (!s) return '<span class="status-badge status-new">Новый</span>';
  const info = STATUSES[s];
  if (!info) return `<span class="status-badge">${s}</span>`;
  return `<span class="status-badge ${info.cls}">${info.label}</span>`;
}

function getFilters() {
  return {
    search: document.getElementById('search-input').value,
    source: document.getElementById('filter-source').value,
    type_:  document.getElementById('filter-type').value,
    status: document.getElementById('filter-status').value,
    has_phone: document.getElementById('filter-phone').value,
  };
}

function buildQuery(extra = {}) {
  const f = { ...getFilters(), limit: LIMIT, offset, ...extra };
  return Object.entries(f).filter(([,v]) => v !== '').map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
}

async function loadContacts() {
  const q = buildQuery();
  const res = await fetch(`/api/contacts?${q}`);
  const data = await res.json();
  total = data.total;

  document.getElementById('total-count').textContent = total.toLocaleString('ru');
  document.getElementById('page-info').textContent = `${offset + 1}–${Math.min(offset + LIMIT, total)} из ${total.toLocaleString('ru')}`;
  document.getElementById('btn-prev').disabled = offset === 0;
  document.getElementById('btn-next').disabled = offset + LIMIT >= total;

  const tbody = document.getElementById('table-body');
  if (!data.records.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="loading">Ничего не найдено</td></tr>';
    return;
  }

  tbody.innerHTML = data.records.map((r, i) => {
    const phones = r.phone ? r.phone.split(' | ').slice(0, 2).join('\n') : '—';
    const activity = r.activity_main || r.niche || '';
    return `<tr onclick="openDetail(${r.id})" class="${r.id == activeId ? 'active' : ''}">
      <td style="color:var(--muted);font-size:11px">${offset + i + 1}</td>
      <td class="name"><span class="ellipsis" style="max-width:200px" title="${esc(r.name)}">${esc(r.name) || '—'}</span></td>
      <td class="phone" style="font-size:11px;white-space:pre">${esc(phones)}</td>
      <td class="region"><span class="ellipsis" style="max-width:120px" title="${esc(r.region)}">${esc(r.region) || '—'}</span></td>
      <td><span class="ellipsis" style="max-width:160px;font-size:12px;color:var(--muted)" title="${esc(activity)}">${esc(activity) || '—'}</span></td>
      <td class="source" style="color:var(--muted)">${esc(r.source || '')}</td>
      <td>${statusBadge(r.call_status)}</td>
      <td style="font-size:12px;color:var(--muted)">${r.next_call_date || ''}</td>
    </tr>`;
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function openDetail(id) {
  activeId = id;
  document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('active'));
  document.querySelectorAll('tbody tr').forEach(tr => {
    if (tr.getAttribute('onclick') === `openDetail(${id})`) tr.classList.add('active');
  });

  const panel = document.getElementById('detail-panel');
  panel.classList.remove('hidden');

  const res = await fetch(`/api/contacts/${id}`);
  const r = await res.json();

  document.getElementById('detail-name').textContent = r.name || '—';
  selectedStatus = r.call_status || '';

  let history = [];
  try { history = JSON.parse(r.call_history || '[]'); } catch {}

  const infoRows = (pairs) => pairs.filter(([,v]) => v).map(([l,v]) =>
    `<div class="info-row"><span class="info-label">${l}</span><span class="info-value">${v}</span></div>`
  ).join('');

  const phones = (r.phone || '').split(' | ').filter(Boolean);
  const emails = (r.email || '').split(' | ').filter(Boolean);

  const phoneHtml = phones.length
    ? phones.map(p => `<a href="tel:${p.replace(/\D/g,'')}">${esc(p)}</a>`).join('<br>')
    : '';
  const emailHtml = emails.length
    ? emails.map(e => `<a href="mailto:${esc(e)}">${esc(e)}</a>`).join('<br>')
    : '';
  const siteHtml = r.website
    ? r.website.split(',').map(s => s.trim()).filter(Boolean).map(s => {
        const href = s.startsWith('http') ? s : 'https://' + s.replace(/^\/\//, '');
        return `<a href="${esc(href)}" target="_blank">${esc(s)}</a>`;
      }).join('<br>')
    : '';

  const fmt = (n) => n ? Number(n).toLocaleString('ru') : '';

  document.getElementById('detail-body').innerHTML = `
    <div class="info-group">
      <div class="info-group-title">Контакты</div>
      ${infoRows([
        ['Телефон', phoneHtml],
        ['Email', emailHtml],
        ['Сайт', siteHtml],
        ['Контакт / ЛПР', esc(r.contact_person)],
        ['LinkedIn', r.linkedin ? `<a href="${esc(r.linkedin)}" target="_blank">${esc(r.linkedin)}</a>` : ''],
      ])}
    </div>

    <div class="info-group">
      <div class="info-group-title">Реквизиты</div>
      ${infoRows([
        ['ИНН', esc(r.inn)],
        ['ОГРН', esc(r.ogrn)],
        ['КПП', esc(r.kpp)],
        ['Тип', esc(r.type)],
        ['Орг. форма', esc(r.org_form)],
        ['Дата рег.', esc(r.reg_date)],
        ['Регион', esc(r.region)],
        ['Адрес', esc(r.address)],
        ['Размер', esc(r.size)],
        ['МСП', esc(r.msp_registry)],
        ['Источник', esc(r.source)],
      ])}
    </div>

    <div class="info-group">
      <div class="info-group-title">Руководство</div>
      ${infoRows([
        ['Руководитель', esc(r.director)],
        ['Должность', esc(r.director_title)],
        ['ИНН рук.', esc(r.director_inn)],
      ])}
    </div>

    <div class="info-group">
      <div class="info-group-title">Деятельность</div>
      ${infoRows([
        ['Основная', esc(r.activity_main)],
        ['Код ОКВЭД', esc(r.activity_code)],
        ['Ниша', esc(r.niche)],
      ])}
    </div>

    <div class="info-group">
      <div class="info-group-title">Финансы</div>
      ${infoRows([
        ['Выручка', fmt(r.revenue)],
        ['Баланс', fmt(r.balance)],
        ['Прибыль', fmt(r.profit)],
        ['Сотрудники', esc(r.employees)],
        ['Уст. капитал', fmt(r.capital)],
        ['Импорт 2023', esc(r.import_turnover)],
        ['Экспорт 2023', esc(r.export_turnover)],
        ['Импорт Китай', esc(r.import_confirmed)],
        ['Платежи заруб.', esc(r.foreign_payments)],
        ['Арбитраж', esc(r.arbitrage)],
      ])}
    </div>

    <div class="info-group">
      <div class="info-group-title">Прочее</div>
      ${infoRows([
        ['Приоритет', esc(r.priority)],
        ['Сегмент', esc(r.segment)],
        ['Комментарий', esc(r.comment)],
        ['Реестры', esc(r.registries)],
        ['Карточка', r.focus_link ? `<a href="${esc(r.focus_link)}" target="_blank">Открыть в Фокусе</a>` : ''],
      ])}
    </div>

    <div class="call-section">
      <div class="call-section-title">Звонок</div>
      <div class="status-grid">
        ${Object.entries(STATUSES).map(([k,v]) =>
          `<button class="status-btn s-${k} ${selectedStatus === k ? 'selected' : ''}" onclick="selectStatus('${k}')">${v.label}</button>`
        ).join('')}
      </div>
      <textarea class="note-input" id="call-note" placeholder="Заметка к звонку...">${esc(r.call_notes)}</textarea>
      <div class="info-row" style="align-items:center;gap:8px">
        <span class="info-label" style="width:auto">Перезвонить:</span>
        <input type="date" class="date-input" id="next-call-date" value="${r.next_call_date || ''}" style="width:160px">
      </div>
      <button class="save-call-btn" id="save-call-btn" onclick="saveCall(${id})">Сохранить звонок</button>
    </div>

    <div class="info-group">
      <div class="info-group-title">История звонков (${history.length})</div>
      ${history.length === 0 ? '<span class="empty-history">Звонков ещё не было</span>' :
        '<div class="history-list">' + history.slice().reverse().map(h => `
          <div class="history-item">
            <div class="history-item-header">
              <span class="history-date">${esc(h.date)}</span>
              ${statusBadge(h.status)}
            </div>
            ${h.notes ? `<div class="history-notes">${esc(h.notes)}</div>` : ''}
          </div>`).join('') + '</div>'
      }
    </div>
  `;
}

function selectStatus(s) {
  selectedStatus = s;
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.classList.toggle('selected', btn.classList.contains('s-' + s));
  });
}

async function saveCall(id) {
  const btn = document.getElementById('save-call-btn');
  btn.disabled = true;
  btn.textContent = 'Сохраняю...';

  const note = document.getElementById('call-note').value;
  const nextDate = document.getElementById('next-call-date').value;

  if (!selectedStatus) {
    showToast('Выберите статус звонка');
    btn.disabled = false;
    btn.textContent = 'Сохранить звонок';
    return;
  }

  await fetch(`/api/contacts/${id}/call`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ status: selectedStatus, notes: note, next_call_date: nextDate })
  });

  showToast('Звонок сохранён');
  btn.disabled = false;
  btn.textContent = 'Сохранить звонок';
  await loadContacts();
  openDetail(id);
}

function closeDetail() {
  activeId = null;
  document.getElementById('detail-panel').classList.add('hidden');
  document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('active'));
}

function prevPage() {
  if (offset > 0) { offset = Math.max(0, offset - LIMIT); loadContacts(); }
}

function nextPage() {
  if (offset + LIMIT < total) { offset += LIMIT; loadContacts(); }
}

function resetFilters() {
  document.getElementById('search-input').value = '';
  document.getElementById('filter-source').value = '';
  document.getElementById('filter-type').value = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-phone').value = '';
  offset = 0;
  loadContacts();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Автозагрузка источников
async function loadMeta() {
  const res = await fetch('/api/meta');
  const data = await res.json();
  const sel = document.getElementById('filter-source');
  data.sources.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}

// Поиск с задержкой
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { offset = 0; loadContacts(); }, 400);
});

['filter-source','filter-type','filter-status','filter-phone'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { offset = 0; loadContacts(); });
});

loadMeta();
loadContacts();
</script>
</body>
